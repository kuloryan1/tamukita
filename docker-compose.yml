services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tamukita}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting the application stack}
      POSTGRES_DB: ${POSTGRES_DB:-tamukita}
    volumes:
      - tamukita-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - tamukita-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tamukita}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting the application stack}@postgres:5432/${POSTGRES_DB:-tamukita}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    environment:
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-tamukita}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting the application stack}@postgres:5432/${POSTGRES_DB:-tamukita}?schema=public
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in the deployment environment}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL in the deployment environment}
      XENDIT_SECRET_KEY: ${XENDIT_SECRET_KEY:-}
      XENDIT_WEBHOOK_TOKEN: ${XENDIT_WEBHOOK_TOKEN:-}
      XENDIT_REFUND_WEBHOOK_TOKEN: ${XENDIT_REFUND_WEBHOOK_TOKEN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: "${EMAIL_FROM:-}"
      RESELLER_BASIC_ACTIVATION_PRICE_IDR: ${RESELLER_BASIC_ACTIVATION_PRICE_IDR:-}
      RESELLER_PREMIUM_ACTIVATION_PRICE_IDR: ${RESELLER_PREMIUM_ACTIVATION_PRICE_IDR:-}
      CUSTOMER_ACTIVATION_PRICE_IDR: ${CUSTOMER_ACTIVATION_PRICE_IDR:-0}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PRIVATE_BUCKET_NAME: ${R2_PRIVATE_BUCKET_NAME:-}
      R2_PUBLIC_BUCKET_NAME: ${R2_PUBLIC_BUCKET_NAME:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
    expose:
      - "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - default
      - staging-origin

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tamukita}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting the application stack}@postgres:5432/${POSTGRES_DB:-tamukita}?schema=public
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL in the deployment environment}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: "${EMAIL_FROM:-}"
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PRIVATE_BUCKET_NAME: ${R2_PRIVATE_BUCKET_NAME:-}
      R2_PUBLIC_BUCKET_NAME: ${R2_PUBLIC_BUCKET_NAME:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      DATA_RETENTION_ENABLED: ${DATA_RETENTION_ENABLED:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node_modules/.bin/tsx", "scripts/healthcheck-worker.ts"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  tamukita-postgres:
  tamukita-redis:

networks:
  default:
  staging-origin:
    name: ${TAMUKITA_ORIGIN_NETWORK:-${TAMUKITA_STAGING_ORIGIN_NETWORK:-${COMPOSE_PROJECT_NAME:-tamukita}_staging-origin}}
