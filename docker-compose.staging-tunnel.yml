services:
  cloudflared:
    image: cloudflare/cloudflared:2026.10.1
    command: ["tunnel", "--no-autoupdate", "run"]
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in the staging tunnel service environment}
    networks:
      - staging-origin

networks:
  staging-origin:
    name: ${TAMUKITA_ORIGIN_NETWORK:-${TAMUKITA_STAGING_ORIGIN_NETWORK:-tamukita-staging-xwcuty_staging-origin}}
    external: true
