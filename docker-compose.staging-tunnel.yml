services:
  cloudflared:
    image: cloudflare/cloudflared:2026.10.1
    command: ["tunnel", "--no-autoupdate", "run"]
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in the staging tunnel service environment}
    networks:
      - dokploy-network

networks:
  dokploy-network:
    name: dokploy-network
    external: true
