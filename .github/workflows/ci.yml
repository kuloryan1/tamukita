name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/tamukita?schema=public
      AUTH_SECRET: ci-only-secret-not-for-deployment
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit locked dependencies
        run: npm audit --audit-level=moderate
      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Build worker runtime image
        run: docker build --target worker --tag tamukita-worker-ci .
      - name: Validate staging Tunnel Compose configuration
        env:
          TUNNEL_TOKEN: ci-only-validation-placeholder
        run: docker compose -f docker-compose.staging-tunnel.yml config --quiet
      - name: Validate production Tunnel Compose configuration
        env:
          TAMUKITA_ORIGIN_NETWORK: tamukita-production-origin
          TUNNEL_TOKEN: ci-only-validation-placeholder
        run: docker compose -f docker-compose.production-tunnel.yml config --quiet
      - name: Validate staging and production Tunnel network isolation
        shell: bash
        env:
          TUNNEL_TOKEN: ci-only-validation-placeholder
        run: |
          docker compose --env-file .env.example -p tamukita-staging-xwcuty config --format json > "$RUNNER_TEMP/tamukita-app-compose.json"
          docker compose -f docker-compose.staging-tunnel.yml config --format json > "$RUNNER_TEMP/tamukita-tunnel-compose.json"
          TAMUKITA_ORIGIN_NETWORK=tamukita-production-origin docker compose --env-file .env.example -p tamukita config --format json > "$RUNNER_TEMP/tamukita-production-compose.json"
          TAMUKITA_ORIGIN_NETWORK=tamukita-production-origin docker compose -f docker-compose.production-tunnel.yml config --format json > "$RUNNER_TEMP/tamukita-production-tunnel-compose.json"
          node scripts/validate-tunnel-network-isolation.mjs \
            "$RUNNER_TEMP/tamukita-app-compose.json" \
            "$RUNNER_TEMP/tamukita-tunnel-compose.json" \
            "$RUNNER_TEMP/tamukita-production-compose.json" \
            "$RUNNER_TEMP/tamukita-production-tunnel-compose.json"
      - name: Validate local Compose override
        run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.local.yml config --quiet
      - name: Test Dokploy PostgreSQL container discovery
        run: bash tests/ops/find-postgres-container.test.sh
      - name: Test backup S3 endpoint policy
        run: bash tests/ops/backup-s3-endpoint.test.sh
      - name: Require a database password
        shell: bash
        env:
          POSTGRES_PASSWORD: ""
        run: |
          if output="$(docker compose --env-file .env.example config --quiet 2>&1)"; then
            echo "Docker Compose accepted an empty database password." >&2
            exit 1
          fi
          if ! grep -q "POSTGRES_PASSWORD" <<<"$output"; then
            echo "$output" >&2
            exit 1
          fi
      - run: npx prisma validate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start isolated PostgreSQL and MinIO
        shell: bash
        run: |
          docker run --detach --name tamukita-backup-postgres \
            --publish 127.0.0.1:25434:5432 \
            --env POSTGRES_USER=e2e --env POSTGRES_PASSWORD=e2e-backup-only \
            --env POSTGRES_DB=postgres postgres:17-alpine
          docker run --detach --name tamukita-backup-minio \
            --publish 127.0.0.1:29000:9000 \
            --env MINIO_ROOT_USER=backup-test \
            --env MINIO_ROOT_PASSWORD=backup-test-only-secret \
            ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z \
            server /data --console-address :9001
          for attempt in {1..45}; do
            if docker exec tamukita-backup-postgres pg_isready -U e2e -d postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec tamukita-backup-postgres pg_isready -U e2e -d postgres
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:29000/minio/health/ready >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:29000/minio/health/ready >/dev/null
      - name: Run encrypted backup and restore drill
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: "25434"
          PGUSER: e2e
          PGPASSWORD: e2e-backup-only
          BACKUP_S3_ENDPOINT: http://127.0.0.1:29000
          BACKUP_S3_ALLOW_HTTP: "true"
          BACKUP_TEST_ACCESS_KEY_ID: backup-test
          BACKUP_TEST_SECRET_ACCESS_KEY: backup-test-only-secret
        run: |
          docker run --rm --network host \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            --env PGHOST --env PGPORT --env PGUSER --env PGPASSWORD \
            --env BACKUP_S3_ENDPOINT --env BACKUP_S3_ALLOW_HTTP \
            --env BACKUP_TEST_ACCESS_KEY_ID --env BACKUP_TEST_SECRET_ACCESS_KEY \
            alpine:3.22 sh -ec 'apk add --no-cache age aws-cli bash coreutils postgresql-client && bash tests/ops/backup-restore-local.integration.sh'
      - name: Remove isolated backup test services
        if: always()
        shell: bash
        run: docker rm --force tamukita-backup-postgres tamukita-backup-minio || true
