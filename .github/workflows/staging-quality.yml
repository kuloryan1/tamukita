name: Staging quality

on:
  workflow_dispatch:
    inputs:
      confirm_staging_load:
        description: Konfirmasi staging siap menerima pengujian hingga 1.000 virtual user
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: staging-quality
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: staging
      deployment: false
    env:
      BASE_URL: ${{ vars.STAGING_BASE_URL }}
      LOAD_TEST_TARGET: staging
      API_PATH: /api/health
      INVITATION_PATH: ${{ vars.STAGING_INVITATION_PATH }}
      PERF_BASE_URL: ${{ vars.STAGING_BASE_URL }}
      PERF_TEST_TARGET: staging
      PERF_INVITATION_PATH: ${{ vars.STAGING_INVITATION_PATH }}
      PRODUCTION_HEALTH_URL: ${{ vars.PRODUCTION_HEALTH_URL }}
      STAGING_LOAD_CONFIRMED: ${{ inputs.confirm_staging_load }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate staging target
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const baseUrl = process.env.BASE_URL;
          const invitationPath = process.env.INVITATION_PATH;
          if (!baseUrl || !invitationPath) {
            throw new Error("Configure STAGING_BASE_URL and STAGING_INVITATION_PATH in the GitHub staging environment.");
          }
          if (process.env.STAGING_LOAD_CONFIRMED !== "true") {
            throw new Error("Confirm that staging is isolated and ready for up to 1,000 virtual users before starting these tests.");
          }
          const target = new URL(baseUrl);
          if (target.protocol !== "https:" || target.pathname !== "/" || target.search || target.hash || target.username || target.password) {
            throw new Error("STAGING_BASE_URL must be an HTTPS origin without credentials, path, query, or fragment.");
          }
          if (["tamukita.io", "www.tamukita.io"].includes(target.hostname.toLowerCase())) {
            throw new Error("Refusing to load test the production TamuKita domain.");
          }
          if (!process.env.PRODUCTION_HEALTH_URL) {
            throw new Error("Set the PRODUCTION_HEALTH_URL repository variable so the staging host can be checked against production.");
          }
          const productionHealth = new URL(process.env.PRODUCTION_HEALTH_URL);
          if (productionHealth.protocol !== "https:" || productionHealth.pathname !== "/api/health" || productionHealth.search || productionHealth.hash || productionHealth.username || productionHealth.password) {
            throw new Error("PRODUCTION_HEALTH_URL must be an HTTPS /api/health URL without credentials, query, or fragment.");
          }
          if (productionHealth.hostname.toLowerCase() === target.hostname.toLowerCase()) {
            throw new Error("Refusing to load test the configured production host.");
          }
          if (!/^\/[A-Za-z0-9][A-Za-z0-9_-]*$/.test(invitationPath)) {
            throw new Error("STAGING_INVITATION_PATH must be a same-origin published invitation path such as /slug-undangan-uji.");
          }
          console.log(`Staging quality target: ${target.origin}${invitationPath}`);
          NODE
      - uses: grafana/setup-k6-action@v1
      - run: npx playwright install --with-deps chromium
      - name: Measure mobile invitation LCP
        run: npm run test:performance:lcp
      - name: Load test health API to 1,000 virtual users
        run: npm run test:load:api
      - name: Load test published invitation to 1,000 virtual users
        run: npm run test:load:public
