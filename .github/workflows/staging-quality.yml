name: Staging quality

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Pilih pengukuran performa saja atau pengujian penuh dengan beban
        type: choice
        required: true
        default: performance-only
        options:
          - performance-only
          - full-load
      confirm_staging_load:
        description: Konfirmasi staging siap menerima pengujian hingga 1.000 virtual user
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: staging-quality
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: staging
      deployment: false
    env:
      BASE_URL: ${{ vars.STAGING_BASE_URL }}
      LOAD_TEST_TARGET: staging
      API_PATH: /api/health
      INVITATION_PATH: ${{ vars.STAGING_INVITATION_PATH }}
      PERF_BASE_URL: ${{ vars.STAGING_BASE_URL }}
      PERF_TEST_TARGET: staging
      PERF_INVITATION_PATH: ${{ vars.STAGING_INVITATION_PATH }}
      PERF_EXPECT_COVER_PHOTO: "true"
      PRODUCTION_HOSTNAMES: ${{ vars.PRODUCTION_HOSTNAMES }}
      STAGING_QUALITY_PROFILE: ${{ inputs.profile }}
      STAGING_LOAD_CONFIRMED: ${{ inputs.confirm_staging_load }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate staging target
        run: node scripts/validate-staging-quality-target.mjs
      - uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1.2.1
        if: ${{ inputs.profile == 'full-load' }}
      - run: npx playwright install --with-deps chromium
      - name: Measure mobile invitation LCP
        run: npm run test:performance:lcp
      - name: Load test health API to 1,000 virtual users
        if: ${{ inputs.profile == 'full-load' }}
        run: npm run test:load:api
      - name: Load test published invitation to 1,000 virtual users
        if: ${{ inputs.profile == 'full-load' }}
        run: npm run test:load:public
